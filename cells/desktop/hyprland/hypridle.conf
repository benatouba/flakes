general {
    lock_cmd = pidof hyprlock || lock_screen       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = pidof hyprlock || lock_screen  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"  # to avoid having to press a key twice to turn on the display.
}

# hyprland runs a lua config, so `hyprctl dispatch` takes a lua expression:
# plain `hyprctl dispatch dpms off` comes back as
# `error: [string "return hl.dispatch(dpms on)"]: ')' expected near 'on'` and
# does nothing.  The quotes matter too - hypridle hands these lines to sh, and
# bare parentheses are a shell syntax error.
#
# The state has to be passed as `{ action = 'on' | 'off' }`.  A bare string
# (`hl.dsp.dpms('on')`) is silently ignored and the dispatcher falls back to
# *toggle*, which is what this file used to do.  Two toggles race on every
# resume (the 540s rule's on-resume plus after_sleep_cmd), so the panels came
# back off more often than not.
#
# Locking spawns hyprlock directly instead of going through
# `loginctl lock-session`.  hypridle binds to whatever logind calls the
# user's display session when it starts; after a compositor restart that can
# be a stale tty login, and every Lock signal then lands on a session nobody
# listens to - no idle lock, and no lock before suspend.  hyprlock's
# ext-session-lock is what hypridle's sleep inhibitor waits on anyway, so
# nothing is lost by skipping logind here.

listener {
    timeout = 300                                # 5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 480                                 # 8min
    on-timeout = pidof hyprlock || lock_screen       # lock screen when timeout has passed
}

listener {
    timeout = 540                                                     # 9min
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"   # screen off when timeout has passed
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })" && brightnessctl -r   # screen on when activity is detected after timeout has fired.
}

# The panel is the single largest consumer on this machine, so reach dpms-off
# and suspend well before the old 11/30min marks.  s2idle on this platform
# still bleeds 1-3%/h, which is why suspend comes early rather than late.
listener {
    timeout = 900                                 # 15min
    on-timeout = systemctl suspend                # suspend pc
}
