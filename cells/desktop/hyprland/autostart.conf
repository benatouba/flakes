# Environment
env = QT_QPA_PLATFORMTHEME, kvantum
env = ELECTRON_OZONE_PLATFORM_HINT, wayland

# Session setup
exec-once = ~/.config/hypr/scripts/resetXdgPortal.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user restart pipewire

# Bar, tray and notifications. This hyprlang file is only used on the
# pre-0.55 fallback path (see legacyHyprlandConfig in ../hyprland.nix); the Lua
# path picks between waybar+swaync and omarchy-launch-shell from
# my.enableOmarchyShell. This file cannot read that flag, so it takes the
# Omarchy shell, which is what the flag defaults to.
exec-once = omarchy-launch-shell
exec-once = nm-applet

# Wallpaper
exec-once = hyprpaper
exec-once = sleep 1 && bash ~/.config/hypr/scripts/random-wallpaper.sh

# XSettings daemon (for GTK/X11 app theming)
exec-once = xsettingsd

# Night light (Hyprland-native)
exec-once = hyprsunset -t 5200

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Terminal mux server
exec-once = wezterm-mux-server --daemonize --cwd ~/

# Idle management
exec-once = hypridle
