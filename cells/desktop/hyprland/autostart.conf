# Environment
env = QT_QPA_PLATFORMTHEME, kvantum
env = ELECTRON_OZONE_PLATFORM_HINT, wayland

# Session setup
#
# The desktop components are systemd user units now (see the `services` block
# in cells/desktop/hyprland.nix and the hand-written units in
# notifications.nix and scripts/waybar-scripts.nix), bound to
# graphical-session.target. home-manager starts hyprland-session.target itself,
# so nothing needs launching from here.
#
# This file is the hyprlang fallback, only reached on Hyprland < 0.55. It is
# kept in step with the Lua path so the fallback does not rot, but note the
# units are emitted by home-manager regardless of which config format is in
# use — so on the fallback path they still start; this file just must not
# start a second copy of everything.

# Terminal mux server — self-daemonising, so not a unit yet.
exec-once = wezterm-mux-server --daemonize --cwd ~/
